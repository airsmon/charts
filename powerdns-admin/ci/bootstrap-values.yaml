# First-install profile for an empty application database. Keep the external
# route disabled, use kubectl port-forward in a controlled maintenance window,
# register the first Administrator, and then switch to the steady profile.
# The ClusterIP remains reachable inside the cluster unless the platform
# provides tested equivalent isolation.
config:
  csrfCookieSecure: false
  hstsEnabled: false
  serverExternalSsl: false
  sessionCookieSecure: false
  signupEnabled: true
  siteUrl: http://127.0.0.1:8080

route:
  enabled: false

networkPolicy:
  enabled: false
