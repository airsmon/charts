{{- if .Values.networkPolicy.enabled }}
{{- $annotations := mergeOverwrite (dict) .Values.commonAnnotations -}}
{{- if eq .Values.migration.mode "argocdHook" -}}
{{- $_ := set $annotations "argocd.argoproj.io/sync-wave" "-30" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "powerdns-admin.suffixedName" (dict "context" . "suffix" "web") | quote }}
  namespace: {{ include "powerdns-admin.namespace" . | quote }}
  labels:
    {{- include "powerdns-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: "web"
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "powerdns-admin.webSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or .Values.networkPolicy.web.fromAllNamespaces .Values.networkPolicy.web.from }}
  ingress:
    - from:
        {{- if .Values.networkPolicy.web.fromAllNamespaces }}
        - namespaceSelector: {}
        {{- else }}
        {{- toYaml .Values.networkPolicy.web.from | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "powerdns-admin.suffixedName" (dict "context" . "suffix" "postgresql") | quote }}
  namespace: {{ include "powerdns-admin.namespace" . | quote }}
  labels:
    {{- include "powerdns-admin.labels" . | nindent 4 }}
    app.kubernetes.io/component: "database"
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "powerdns-admin.postgresqlSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "powerdns-admin.name" . | quote }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - port: postgresql
          protocol: TCP
{{- end }}
{{- end }}
