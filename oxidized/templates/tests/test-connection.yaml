{{- if and .Values.web.enabled .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "oxidized.suffixedName" (dict "context" . "suffix" "test-connection") | quote }}
  namespace: {{ include "oxidized.namespace" . | quote }}
  labels:
    {{- include "oxidized.labels" . | nindent 4 }}
    app.kubernetes.io/component: "test"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "oxidized.serviceAccountName" . | quote }}
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.tests.podSecurityContext | nindent 4 }}
  {{- $imagePullSecrets := include "oxidized.imagePullSecrets" . | trim }}
  {{- if $imagePullSecrets }}
  imagePullSecrets:
    {{- $imagePullSecrets | nindent 4 }}
  {{- end }}
  containers:
    - name: wget
      image: {{ include "oxidized.testImage" . | quote }}
      imagePullPolicy: {{ .Values.tests.image.pullPolicy | quote }}
      securityContext:
        {{- toYaml .Values.tests.containerSecurityContext | nindent 8 }}
      command:
        - wget
      args:
        - "-qO-"
        {{- with first .Values.web.vhosts }}
        - "--header"
        - {{ printf "Host: %s" . | quote }}
        {{- end }}
        - {{ printf "http://%s:%v%s" (include "oxidized.fullname" .) .Values.service.port .Values.readinessProbe.path | quote }}
{{- end }}
